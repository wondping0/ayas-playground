name: Bug report
description: Report a reproducible defect
body:
  - type: markdown
    attributes:
      value: "For vulnerabilities, email wondev.support@gmail.com privately. Do not include secrets or private bundles."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Explain the actual behavior and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the smallest example that demonstrates the problem.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Commit, OS, Node version, runner, and store implementation.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs or screenshots
